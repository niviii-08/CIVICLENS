name: CIVICLENS TN Quality & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: TypeScript Type Check
        run: npm run typecheck --prefix frontend

      - name: Build Next.js Production Bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build --prefix frontend

  backend-quality:
    name: Backend Tests & Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///tmp/civiclens_ci.db
      ENV: testing
      DEBUG: "False"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python (v3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Python Syntax Validation
        run: |
          python -c "
          import py_compile, glob, sys
          files = glob.glob('backend/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True)
          errors = [f for f in files if not py_compile.compile(f)]
          if errors:
              print(f'Syntax errors in: {errors}')
              sys.exit(1)
          print(f'Verified syntax of {len(files)} Python files.')
          "

      - name: Alembic Database Migration Validation
        run: |
          alembic upgrade head
          alembic current

      - name: Run Quality Verification Runner
        run: python scripts/run_quality_checks.py

  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Dependency Vulnerability Scan
        continue-on-error: true
        run: npm audit --prefix frontend --audit-level=high
